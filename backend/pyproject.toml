[project]
name = "resumeiq-backend"
version = "1.0.0"
description = "Requirement-first resume screening and candidate ranking"
requires-python = ">=3.11"

dependencies = [
  # Web
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "gunicorn>=22.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",

  # Database
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "psycopg[binary]>=3.2.0",
  "pgvector>=0.3.0",

  # Auth
  "argon2-cffi>=23.1.0",
  "python-jose[cryptography]>=3.3.0",

  # Queue and cache
  "arq>=0.26.0",
  "redis>=5.0.0",

  # Storage
  "boto3>=1.34.0",

  # Document extraction
  "pymupdf>=1.24.0",
  "python-docx>=1.1.0",
  "pytesseract>=0.3.10",
  "opencv-python-headless>=4.10.0",
  "pillow>=10.4.0",

  # NLP / AI
  "anthropic>=0.34.0",
  "sentence-transformers>=3.0.0",
  "rank-bm25>=0.2.2",

  # Observability
  "structlog>=24.4.0",
  "opentelemetry-api>=1.26.0",
  "opentelemetry-sdk>=1.26.0",
  "opentelemetry-instrumentation-fastapi>=0.47b0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "hypothesis>=6.111.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",
  "B008",
  "RUF001",
  "RUF002",
  "RUF007",
  "RUF012",
  "N801",
  "N802",
  "N814",
  "N818",
  "E741",
  "SIM105",
  "SIM108",
  "SIM115",
  "B007",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
