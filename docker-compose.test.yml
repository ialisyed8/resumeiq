# Isolated stack for the integration suite.
#
# Separate from docker-compose.yml so a test run can never point at development
# data. Different ports, different database name, tmpfs storage — the whole
# thing is disposable and a `down -v` costs nothing.
#
#   docker compose -f docker-compose.test.yml up -d
#   $env:TEST_DATABASE_URL="postgresql+asyncpg://resumeiq:resumeiq@localhost:5433/resumeiq_test"
#   cd backend; pytest tests/integration -v
#   docker compose -f docker-compose.test.yml down -v

name: resumeiq-test

services:
  postgres-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: resumeiq
      POSTGRES_PASSWORD: resumeiq
      POSTGRES_DB: resumeiq_test
    ports: ["5433:5432"]
    # In-memory: tests do not need durability and this makes them noticeably
    # faster on a laptop.
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumeiq -d resumeiq_test"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis-test:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10
